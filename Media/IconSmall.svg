<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Icon.svg redrawn for about 20 px: the minimap button (inside its round border), the Addon
     Compartment and the addon list. Parchment and quill fill the frame, outlines are thicker, and
     the details that vanish at that size (compass, frame, grain) are left out. -->
<defs>
  <radialGradient id="bg" cx="40%" cy="36%" r="75%">
    <stop offset="0" stop-color="#4a82b4"/>
    <stop offset="0.5" stop-color="#1f4468"/>
    <stop offset="1" stop-color="#0a1626"/>
  </radialGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbf0d0"/>
    <stop offset="0.55" stop-color="#ecd6a4"/>
    <stop offset="1" stop-color="#cfa86a"/>
  </linearGradient>
  <linearGradient id="vaneG" x1="0" y1="-28" x2="0" y2="19" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#eeebe3"/><stop offset="1" stop-color="#a9b1c0"/>
  </linearGradient>
  <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.65"/>
  </filter>
  <path id="sheet" d="M34 44 L82 38 L128 44 L176 36 L222 42
     L216 90 L224 138 L216 186 L220 222
     L172 216 L126 224 L80 216 L36 222
     L42 176 L32 130 L40 86 Z"/>
</defs>
<rect width="256" height="256" fill="url(#bg)"/>
<g filter="url(#drop)">
  <g transform="rotate(-8 128 130)">
    <use href="#sheet" fill="url(#paper)" stroke="#6b4420" stroke-width="5" stroke-linejoin="round"/>
    <!-- the trail, written up to the nib -->
    <circle cx="72" cy="80" r="13" fill="none" stroke="#6a1d10" stroke-width="9"/>
    <path d="M86 82 C142 70 174 104 140 128 C112 148 60 150 68 180 C72 196 88 202 100 200"
          fill="none" stroke="#6a1d10" stroke-width="11" stroke-linecap="round" stroke-dasharray="14 14"/>
  </g>
</g>
<g filter="url(#drop)" transform="translate(94 204) rotate(-50) scale(1.18)">
  <path d="M0 0 L14 -4 L16 4 Z" fill="#1e140d"/>
  <path d="M13 -4.2 L50 -3.4 L50 3.4 L15 4.2 Z" fill="#d9c49a" stroke="#1b2230" stroke-width="2"/>
  <path d="M46 -1.5 C72 -16 104 -29 136 -30 C163 -30 179 -16 183 0 L172 -6 L178 2
           C170 13 152 21 128 21 L121 15 L118 21 C96 20 72 12 46 1.5 Z"
        fill="url(#vaneG)" stroke="#141a26" stroke-width="4" stroke-linejoin="round"/>
  <path d="M44 0 L180 0" stroke="#8e8572" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>
