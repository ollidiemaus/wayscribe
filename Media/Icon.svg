  <path d="M60 -6 L86 -19 M76 -6 L104 -22 M94 -5 L124 -24 M114 -4 L146 -23 M134 -3 L162 -17 M152 -2 L174 -9
           M62 5 L84 11 M80 5 L104 14 M100 4 L124 15 M138 3 L156 12 M156 2 L170 7"
